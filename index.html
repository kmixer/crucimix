<!--
CRUCIMIX v6.4 - VERSIONE STABILE COMPLETA

- Input smart (numeri + operatori)
- Suono vittoria ✔️
- Suono errore ✔️
- Fuochi + animazioni ✔️
- Nessun bug popup
-->

<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>CruciMix</title>

<style>
body {
    font-family: Arial;
    text-align: center;
    background: #a8c0d6;
}

input { box-sizing: border-box; }

/* FUOCHI */
.firework {
    position: fixed;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    animation: explode 0.8s ease-out forwards;
    pointer-events: none;
}

@keyframes explode {
    0% { transform: scale(1); opacity:1; }
    100% { transform: scale(8); opacity:0; }
}

/* CELLE */
.correct-cell {
    animation: popCell 0.3s ease;
    background: #7CFC00 !important;
}

@keyframes popCell {
    0% { transform: scale(1); }
    50% { transform: scale(1.2); }
    100% { transform: scale(1); }
}

/* MATEMATICA */
.grid {
    display: grid;
    gap: 6px;
    justify-content: center;
    margin-top: 20px;
}

.cell {
    width: 50px;
    height: 50px;
    background: #f2d25c;
    border-radius: 8px;
    font-size: 18px;
    display:flex;
    align-items:center;
    justify-content:center;
}

.input-cell {
    width: 48px;
    height: 48px;
    text-align:center;
    font-size:18px;
    border-radius:8px;
    border:2px solid #333;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:0;
}

/* PAROLE */
.row { margin: 10px; }

.letter {
    width: 40px;
    height: 40px;
    margin: 2px;
    text-align: center;
    font-size: 20px;
    border-radius: 6px;
    border:2px solid #333;
}

input.error {
    border: 2px solid red;
    background: #ffb3b3;
}

.empty { visibility: hidden; }

button {
    margin-top:20px;
    padding:10px 20px;
    font-size:16px;
}

#definizioni {
    margin-top:15px;
    font-size:16px;
}
</style>
</head>

<body>

<h1>CruciMix</h1>
<h2 id="level">Livello 1</h2>

<div id="definizioni"></div>
<div id="grid"></div>

<button onclick="controlla()">Controlla</button>

<script>

// =======================
// SUONI (STABILI)
// =======================

const suonoWin = new Audio("https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg");
const suonoErrore = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_8b5b8c1d3c.mp3");

suonoWin.load();
suonoErrore.load();

// =======================
// DATI (TUOI)
// =======================

const baseMath = [
`1;+;9;=;10;;;;
+;;;;-;;;;
5;;;;8;;;;
=;;;;=;;;;
6;-;4;=;2;+;7;=;9
+;;;;+;;;;-
3;;;;3;;;;5
=;;;;=;;;;=
9;-;4;=;5;-;1;=;4`,

`9;-;4;=;5;-;1;=;4;+;4;=;8
-;;;;+;;;;+;;;;-
3;;;;3;;;;1;;;;6
=;;;;=;;;;=;;;;=
6;+;2;=;8;-;3;=;5;-;3;=;2`
];

const livelliParole = [
{def:["Animale che abbaia","Colore del cielo"],sol:["CANE","BLU"]},
{def:["Animale che miagola","Veicolo a ruote e pedali"],sol:["GATTO","BICI"]}
];

// =======================
// VARIABILI
// =======================

let livelloCorrente = 0;
let modalità = "";
let inputMap = {};
let soluzione = [];

// =======================
// FUNZIONI BASE
// =======================

function parseCSV(csvText){
    let rows = csvText.trim().split(/\r?\n/).map(r=>r.split(";"));
    let maxCols = Math.max(...rows.map(r => r.length));
    return rows.map(r=>{
        while(r.length < maxCols) r.push("");
        return r;
    });
}

// =======================
// FUOCHI
// =======================

function fuochi(){

    for(let i=0;i<12;i++){

        let f = document.createElement("div");
        f.className = "firework";

        f.style.left = Math.random()*100 + "%";
        f.style.top = Math.random()*100 + "%";
        f.style.background = `hsl(${Math.random()*360},100%,50%)`;

        document.body.appendChild(f);

        setTimeout(()=>f.remove(),800);
    }
}

// =======================
// CREA LIVELLO
// =======================

function creaGriglia(){

    inputMap = {};
    document.getElementById("definizioni").innerHTML = "";

    modalità = Math.random() < 0.5 ? "math" : "parole";

    if(modalità === "math"){
        creaMath();
    } else {
        creaParole();
    }

    document.getElementById("level").innerText =
        "Livello " + (livelloCorrente + 1) + " (" + modalità + ")";
}

// =======================
// MATH
// =======================

function creaMath(){

    const gridDiv = document.getElementById("grid");
    gridDiv.innerHTML = "";
    gridDiv.className = "grid";

    soluzione = parseCSV(baseMath[livelloCorrente % baseMath.length]);

    let rows = soluzione.length;
    let cols = soluzione[0].length;

    gridDiv.style.gridTemplateColumns = `repeat(${cols},50px)`;

    for(let r=0;r<rows;r++){
        for(let c=0;c<cols;c++){

            let val=soluzione[r][c];

            if(val===""){
                let d=document.createElement("div");
                d.className="cell empty";
                gridDiv.appendChild(d);
                continue;
            }

            if(val==="="){
                let d=document.createElement("div");
                d.className="cell";
                d.innerText=val;
                gridDiv.appendChild(d);
                continue;
            }

            if(Math.random()<0.2){

                let inp=document.createElement("input");
                inp.className="input-cell";
                inp.maxLength = 2;

                inp.addEventListener("input",function(){

                    this.value = this.value.replace(/[^0-9+\-]/g,"");

                    if(this.value.includes("+") || this.value.includes("-")){
                        this.value = this.value.replace(/[^+\-]/g,"");
                        this.maxLength = 1;
                    } else {
                        this.maxLength = 2;
                    }

                });

                inputMap[`${r}-${c}`]={valore:val,elemento:inp};
                gridDiv.appendChild(inp);

            }else{
                let d=document.createElement("div");
                d.className="cell";
                d.innerText=val;
                gridDiv.appendChild(d);
            }
        }
    }
}

// =======================
// PAROLE
// =======================

function creaParole(){

    const grid = document.getElementById("grid");
    grid.innerHTML = "";
    grid.className = "";

    let livello = livelliParole[livelloCorrente % livelliParole.length];

    let html = "";
    livello.def.forEach((d,i)=>{
        html += (i+1)+". "+d+"<br>";
    });

    document.getElementById("definizioni").innerHTML = html;

    livello.sol.forEach((parola,i)=>{

        let row = document.createElement("div");
        row.className = "row";

        for(let j=0;j<parola.length;j++){

            let inp = document.createElement("input");
            inp.className = "letter";
            inp.maxLength = 1;

            inputMap[`${i}-${j}`]={valore:parola[j],elemento:inp};

            inp.addEventListener("input",function(){
                this.value=this.value.toUpperCase();
                if(this.value!==""){
                    let next=this.nextElementSibling;
                    if(next) next.focus();
                }
            });

            row.appendChild(inp);
        }

        grid.appendChild(row);
    });
}

// =======================
// CONTROLLO (FIX SUONI)
// =======================

function controlla(){

	suonoErrore.play().catch(()=>{});
	suonoErrore.pause();
	suonoErrore.currentTime = 0;

    let errore=false;

    for(let k in inputMap){

        let obj=inputMap[k];
        let val=obj.elemento.value.trim().toUpperCase();

        obj.elemento.classList.remove("error");

        if(val==="" || val!=obj.valore){
            obj.elemento.classList.add("error");
            errore=true;
        }
    }

    if(errore){

        // 🔊 SUONO ERRORE
        suonoErrore.currentTime = 0;
        suonoErrore.play();

        return;
    }

    // 🎆 SUCCESSO
    fuochi();

    suonoWin.currentTime = 0;
    suonoWin.play();

    for(let k in inputMap){
        inputMap[k].elemento.classList.add("correct-cell");
    }

    setTimeout(()=>{
        livelloCorrente++;
        creaGriglia();
    },800);
}

// =======================
// START
// =======================

creaGriglia();

</script>
</body>
</html>
